<!DOCTYPE html>
<html>
<body>

<button id="btnConnectS3">Connect Shimmer3</button>
<button id="btnSave">Save CSV</button>

<script type="module">
  import {
    Shimmer3Client,
    WebSerialTransport,
    SensorBitmapShimmer3,
    SHIMMER3_SPP_UUID,
  } from './dist/shimmer-web-sdk.esm.js';

  const client = new Shimmer3Client({
    transport: new WebSerialTransport({
      filters: [{ bluetoothServiceClassId: SHIMMER3_SPP_UUID }],
      allowedBluetoothServiceClassIds: [SHIMMER3_SPP_UUID],
      kind: 'rfcomm',
    }),
  });

  client.onStatus = (msg) => console.log('[status]', msg);

//   client.onStreamFrame = (oc) => {
//     const gz = oc.get('GYRO_Z', 'raw')?.value;
//     console.log('GYRO_Z =', gz);
//   };

  let data = [];

  // oc values
  // 

  client.onStreamFrame = (oc) => {
    console.log(oc);
    const timestamp = oc.get('TIMESTAMP', 'raw')?.value;
    const gx        = oc.get('GYRO_X', 'raw')?.value;
    const gy        = oc.get('GYRO_Y', 'raw')?.value;
    const gz        = oc.get('GYRO_Z', 'raw')?.value;
    const batt      = oc.get('CH_03', 'raw')?.value;
    const gsr_raw   = oc.fields.find(
      f => f.name === 'GSR' && f.kind === 'raw'
    )?.value; // raw GSR
    const gsr_cal   = oc.fields.find(
      f => f.name === 'GSR' && f.kind === 'cal'
    )?.value; // GSR in microSiemens

    data.push([timestamp, gx, gy, gz, batt, gsr_raw, gsr_cal]);
  };

  document.getElementById('btnConnectS3').addEventListener('click', async () => {
    await client.connect();
    await client.setSamplingRate(51.2);
    await client.setSensors( // enable sensors
      SensorBitmapShimmer3.SENSOR_GYRO |
      SensorBitmapShimmer3.SENSOR_A_ACCEL |
      SensorBitmapShimmer3.SENSOR_GSR |
      SensorBitmapShimmer3.SENSOR_VBATT
    );
    await client.startStreaming();
  });

  document.getElementById('btnSave').addEventListener('click', () => {
    const csv = [
        'timestamp,GYRO_X,GYRO_Y,GYRO_Z,BATT,GSR_RAW,GSR_CAL',
        ...data.map(row => row.join(','))
    ].join('\r\n');

    console.log("CSV FILE");
    console.log(csv);

    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);

    const a = document.createElement('a');
    a.href = url;
    a.download = `shimmer_${Date.now()}.csv`;

    document.body.appendChild(a);
    a.click();

    setTimeout(() => {
        URL.revokeObjectURL(url);
        a.remove();
    }, 1000);
});
</script>

</body>
</html>
