<!DOCTYPE html>
<html>
<body>

<button id="btnConnect">Connect Shimmer 3R GSR+</button>
<button id="btnSave">Save CSV</button>

<script type="module">
  import { Shimmer3RClient, SensorBitmapShimmer3 } from './dist/shimmer-web-sdk.esm.js';

  const client = new Shimmer3RClient({ timestampFmt: 'u24', debug: true });

  // Python websocket for data analysis
  const socket = new WebSocket('ws://localhost:8765');
  socket.onopen = () => {
    console.log('Connected to Python websocket');
  };
  socket.onerror = (err) => {
    console.error('Websocket error: ', err);
  };

  // Client response on status
  client.onStatus = (msg) => console.log('[status]', msg);

  let data = []; // log data

  client.onStreamFrame = (oc) => {
    console.log(oc);
    const timestamp = oc.get('TIMESTAMP', 'raw')?.value;
    const gx        = oc.get('GYRO_X', 'raw')?.value;
    const gy        = oc.get('GYRO_Y', 'raw')?.value;
    const gz        = oc.get('GYRO_Z', 'raw')?.value;
    const batt      = oc.get('CH_03', 'raw')?.value;
    const gsr_raw   = oc.fields.find(
      f => f.name === 'GSR' && f.kind === 'raw'
    )?.value; // raw GSR
    const gsr_cal   = oc.fields.find(
      f => f.name === 'GSR' && f.kind === 'cal'
    )?.value; // GSR in microSiemens

    data.push([timestamp, gx, gy, gz, batt, gsr_raw, gsr_cal]);

    // send to python websocket
    socket.send(JSON.stringify({
      device: 'shimmer3r',
      timestamp: timestamp,
      gyro_x: gx,
      gyro_y: gy,
      gyro_z: gz,
      gsr_cal: gsr_cal
    }));
  };

  // Connect to Shimmer upon button press
  document.getElementById('btnConnect').addEventListener('click', async () => {
    await client.connect();
    await client.setSamplingRate(51.2);
    await client.setSensors( // enable sensors
      SensorBitmapShimmer3.SENSOR_GYRO |
      SensorBitmapShimmer3.SENSOR_A_ACCEL |
      SensorBitmapShimmer3.SENSOR_GSR |
      SensorBitmapShimmer3.SENSOR_VBATT);
    await client.startStreaming();
  });

  // Save data to CSV
  document.getElementById('btnSave').addEventListener('click', () => {
      const csv = [
          'timestamp,GYRO_X,GYRO_Y,GYRO_Z,BATT,GSR_RAW,GSR_CAL',
          ...data.map(row => row.join(','))
      ].join('\r\n');

      console.log("CSV FILE");
      console.log(csv);

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob);

      const a = document.createElement('a');
      a.href = url;
      a.download = `shimmer_${Date.now()}.csv`;

      document.body.appendChild(a);
      a.click();

      setTimeout(() => {
          URL.revokeObjectURL(url);
          a.remove();
      }, 1000);
  });

</script>

</body>
</html>
